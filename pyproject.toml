[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataclean"
version = "0.2.0"
description = "DataClean AI — limpieza y reporte de listas de contactos."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<3",
    "openpyxl>=3.1,<4",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]
# Separador de cargo con LLM real (DC.7 vía interfaz sustituible). Opcional:
# sin este extra el sistema usa el separador deterministico y la suite corre
# sin red ni credenciales (regla 7).
llm = [
    "anthropic>=0.40,<2",
]

[project.scripts]
dataclean = "dataclean.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataclean = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
